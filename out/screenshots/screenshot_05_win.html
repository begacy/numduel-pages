<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NumDuel — Win Reveal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame">
    <div class="phone">
      <header>
        <h1>Win Reveal & Celebrate</h1>
        <p class="subtitle">Winner announced, both secrets revealed with confetti.</p>
      </header>
      <div class="card win">
        <div class="reveal">
          <div style="font-size:18px;color:#6C63FF;font-weight:700">Alice</div>
          <div style="font-size:26px;font-weight:800">42</div>
        </div>
        <div class="reveal">
          <div style="font-size:18px;color:#FF6B6B;font-weight:700">Bob</div>
          <div style="font-size:26px;font-weight:800">75</div>
        </div>
      </div>
      <div style="height:20px"></div>
      <p class="muted">Celebrate wins with confetti and a clear reveal.</p>
    </div>
  </div>
</body>
</html>
