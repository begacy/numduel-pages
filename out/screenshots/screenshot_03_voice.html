<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NumDuel — Voice Guessing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame">
    <div class="phone">
      <header>
        <h1>Voice Guessing</h1>
        <p class="subtitle">Speak your guess — app responds "Higher", "Lower", or "Correct".</p>
      </header>
      <div class="card" style="display:flex;flex-direction:column;align-items:center;gap:18px">
        <div class="mic">🎙</div>
        <div class="muted">Tap to guess</div>
        <div class="history">
          <div class="guess">Alice • 42 • Lower</div>
          <div class="guess">Bob • 70 • Higher</div>
        </div>
      </div>
      <div style="height:20px"></div>
      <p class="muted">Hands-free play with speech input.</p>
    </div>
  </div>
</body>
</html>
