<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NumDuel — Guess History</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame">
    <div class="phone">
      <header>
        <h1>Guess History</h1>
        <p class="subtitle">See past guesses, feedback, and whose turn it is.</p>
      </header>
      <div class="card">
        <div class="history">
          <div class="guess">Round 1 • Alice → 42 • Lower</div>
          <div class="guess">Round 1 • Bob → 70 • Higher</div>
          <div class="guess">Round 2 • Alice → 54 • Higher</div>
        </div>
      </div>
      <div style="height:20px"></div>
      <p class="muted">History helps plan your next guess.</p>
    </div>
  </div>
</body>
</html>
