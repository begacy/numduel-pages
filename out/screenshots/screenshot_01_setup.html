<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NumDuel — Setup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame">
    <div class="phone">
      <header>
        <h1>Setup & Start</h1>
        <p class="subtitle">Enter player names and tap "Let's Play" to begin.</p>
      </header>
      <div class="card">
        <div class="field"><span class="muted">Player 1 name</span></div>
        <div class="field"><span class="muted">Player 2 name</span></div>
        <div style="height:18px"></div>
        <a class="btn" href="#">Let's Play</a>
      </div>
      <div style="height:20px"></div>
      <p class="muted">Portrait • 1242×2688 • Title top, UI centered</p>
    </div>
  </div>
</body>
</html>
