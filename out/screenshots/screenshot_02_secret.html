<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NumDuel — Secret Entry</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame">
    <div class="phone">
      <header>
        <h1>Private Secret Entry</h1>
        <p class="subtitle">Each player types a hidden number — no peeking.</p>
      </header>
      <div class="card">
        <div style="text-align:center;margin:18px 0"><div class="big">● ● ●</div></div>
        <div class="field" style="justify-content:center"><span class="muted">0 – 100</span></div>
        <div style="height:18px"></div>
        <a class="btn" href="#">Next →</a>
      </div>
      <div style="height:20px"></div>
      <p class="muted">Keep screen private while typing.</p>
    </div>
  </div>
</body>
</html>
