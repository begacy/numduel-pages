name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          # Use a personal access token stored in secrets when GITHUB_TOKEN
          # cannot perform Pages enablement (Resource not accessible by integration).
          # Create a PAT with appropriate scopes and add it as `GH_PAGES_TOKEN`.
          token: ${{ secrets.GH_PAGES_TOKEN }}

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
